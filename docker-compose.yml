services:
  analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    image: akshare-tech-analyzer:local
    container_name: akshare-tech-analyzer
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      CACHE_DB: /data/cache/market.db
      REPORT_DIR: /data/reports
      LOG_DIR: /data/logs
      MAX_PROVIDER_CONCURRENCY: 2
      MINUTE_CACHE_TTL: 60
      DAILY_CACHE_TTL: 7200
      SNAPSHOT_CACHE_TTL: 20
      INSTRUMENT_LIST_CACHE_TTL: 14400
      REQUEST_RETRIES: 3
    volumes:
      - ./data/cache:/data/cache
      - ./data/reports:/data/reports
      - ./data/logs:/data/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
