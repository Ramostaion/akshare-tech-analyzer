[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "akshare-tech-analyzer"
version = "0.3.0"
description = "基于 AKShare 的中国证券、美股、美国指数与外盘期货技术分析工作台"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "akshare>=1.16.0",
  "fastapi>=0.115.0",
  "jinja2>=3.1.4",
  "numpy>=2.0.0",
  "pandas>=2.2.0",
  "plotly>=5.24.0",
  "pydantic>=2.9.0",
  "requests>=2.32.0",
  "tzdata>=2024.1; platform_system == 'Windows'",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "playwright>=1.50.0",
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[project.scripts]
akshare-analyzer = "app.cli:main"

[tool.setuptools]
packages = ["app", "app.gann", "app.wave"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
